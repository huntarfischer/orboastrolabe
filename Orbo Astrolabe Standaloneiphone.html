document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U5ErkJggg==\">\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; background: #0b081c; }\n  a { color: #4da4d9; text-decoration: none; }\n  a:hover { color: #7cc0e8; }\n  input { color-scheme: dark; }\n  input::placeholder { color: #5a5090; }\n  input[type=\"range\"] { accent-color: #e8ab41; }\n  /* the eclipse — first contact: the Sun's light flares warm at the Moon's limb, then settles */\n  @keyframes eclipseContact {\n    0% { opacity: 0; }\n    22% { opacity: 0.9; }\n    100% { opacity: 0; }\n  }\n<\u002Fstyle>\n<!-- Plain (non-module) script tags, each self-registering a window.__ORBO_* global.\n     Plain `src=` references are what the standalone bundler actually inlines \\u2014 an ES\n     `import './x.js'` inside an inline <script type=\"module\"> is invisible to it (it only\n     sees HTML attributes, not JS import specifiers), so bundled exports silently shipped\n     without the engine and the app hung at \"...\". These *.browser.js files are generated\n     from ephem.js/framing.js/transits.js/cities.js with exports rewritten to a plain global\n     assignment \\u2014 same math, zero ES-module surface. Regenerate them if the source .js\n     files change; don't hand-edit the .browser.js copies. -->\n<script src=\"0464915c-7618-4498-8392-c574916f56bd\"><\u002Fscript>\n<script src=\"416938a2-6498-4323-b4ae-a42bb00864d3\"><\u002Fscript>\n<script src=\"258f3df3-c761-4d86-8f56-6caaeb0559ec\"><\u002Fscript>\n<script src=\"6dbba2ad-0969-41fb-84a5-80c61b1e17b6\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#0b081c;display:flex;justify-content:center;font-family:'Avenir Next','Century Gothic',Futura,'Trebuchet MS',sans-serif;color:#dcd7f0;\">\n  <div style=\"width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,0.85);background-color:#0c081f;background-image:linear-gradient(180deg, #0c081f 0%, #131a3e 24%, #26496e 46%, #7e5f2e 68%, #94522b 82%, #7c3a2f 94%, #632a2a 100%);background-repeat:no-repeat;background-size:100% 100%;\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 31px 27px, rgba(246,244,255,0.95), transparent 60%),radial-gradient(1px 1px at 118px 63px, rgba(236,232,248,0.7), transparent 60%),radial-gradient(1.3px 1.3px at 74px 141px, rgba(196,208,248,0.8), transparent 60%),radial-gradient(0.9px 0.9px at 163px 108px, rgba(236,232,248,0.55), transparent 60%),radial-gradient(1.1px 1.1px at 22px 189px, rgba(255,240,220,0.6), transparent 60%),radial-gradient(0.8px 0.8px at 201px 161px, rgba(236,232,248,0.5), transparent 60%),radial-gradient(1.4px 1.4px at 147px 217px, rgba(214,224,255,0.75), transparent 60%),radial-gradient(0.9px 0.9px at 55px 88px, rgba(236,232,248,0.6), transparent 60%);background-size:231px 231px,199px 199px,253px 253px,181px 181px,269px 269px,211px 211px,241px 241px,223px 223px;mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);-webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:#05030f;opacity:{{ eclipseVeil }};transition:opacity 0.5s cubic-bezier(0.3,1,0.4,1);\"><\u002Fdiv>\n\n    <div style=\"padding:20px 22px 8px 22px;display:flex;flex-direction:column;gap:7px;position:relative;\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;\">\n        <div style=\"font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8f86c0;\">Orbo Astrolabe<\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#5a5090;\">prototype<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:6px;min-height:28px;\">\n        <canvas ref=\"{{ moonHeadRef }}\" width=\"32\" height=\"32\" style=\"width:16px;height:16px;border-radius:50%;flex-shrink:0;\"><\u002Fcanvas>\n        <div ref=\"{{ skyRef }}\" style=\"font-size:22px;line-height:1.25;color:#f2f0fc;letter-spacing:0.02em;text-align:center;\">…<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ dateUnder }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:7px;min-height:14px;\">\n          <div ref=\"{{ civilRef }}\" sc-camel-on-pointer-down=\"{{ clockDown }}\" sc-camel-on-pointer-up=\"{{ clockUp }}\" sc-camel-on-pointer-leave=\"{{ clockCancel }}\" style=\"font-size:12px;color:#a99ecf;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;\">&nbsp;<\u002Fdiv>\n          <sc-if value=\"{{ seatToggleShown }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ toggleSeats }}\" title=\"bring in a seat\" style=\"cursor:pointer;font-size:11px;line-height:1;color:#6a5fa0;padding:2px 4px;border:1px solid rgba(143,134,192,0.28);border-radius:6px;\">⇅<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div ref=\"{{ gearRef }}\" style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#e8ab41;min-height:14px;white-space:nowrap;text-align:center;\">&nbsp;<\u002Fdiv>\n      <sc-if value=\"{{ showSeats }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:8px;margin-top:2px;\">\n          <div sc-camel-on-click=\"{{ tapPlateSeat }}\" style=\"flex:1;cursor:pointer;border:1px solid {{ seatPlateBd }};border-radius:10px;padding:6px 9px;background:rgba(0,0,0,0.22);display:flex;flex-direction:column;gap:1px;min-width:0;\">\n            <div style=\"font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:#5a5090;\">the plate<\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ seatPlateCol }};white-space:nowrap;o e,\n      30: false, 45: false, 51.4286: false, 72: false, 102.8571: false, 135: false, 144: false, 150: false, 154.2857: false,\n    };\n    // minor aspects use a tighter fraction of the global orb slider — conventional orb widths\n    // shrink by family the same way the doc's traditional/modern sources treat them.\n    this.ORB_SCALE = {\n      0: 1, 60: 1, 90: 1, 120: 1, 180: 1,\n      30: 0.5, 150: 0.5, 45: 0.45, 135: 0.45, 72: 0.4, 144: 0.4,\n      51.4286: 0.35, 102.8571: 0.35, 154.2857: 0.35,\n    };\n    this.JD_MIN = 2341973; this.JD_MAX = 2506331; // 1700-01-01 – 2149-12-31 (widened from 1800–2050; see ephem.js header)\n    this._screen = {}; this._lastReadout = {};\n    // the back: twelve rim slots in zodiacal order from 9 o'clock\n    this.SECTIONS = [\n      { id: 'natal', name: 'Natal chart' }, { id: 'loc', name: 'Here & now' }, { id: 'planets', name: 'Planets' },\n      { id: 'moon', name: 'Moon' }, { id: 'skin', name: 'Appearance' }, { id: 'aspects', name: 'Aspects' },\n      { id: 'people', name: 'People' }, { id: 'objects', name: 'Objects' }, { id: null, name: 'Lenses' },\n      { id: 'transport', name: 'Gears' }, { id: 'events', name: 'Events' }, { id: 'composite', name: 'Composite' },\n    ];\n    this.DEFAULTS = { orb: 6, showWeb: true, playSpeed: 6, rimGear: 2.75, snapMagnet: 0.7, haptics: true, showPlayIcon: false };\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('orbo.astrolabe.back')) || {}; } catch (e) {}\n    // migrate old plain events list into the saved-charts model\n    let charts = saved.saved || (saved.events || []).map((ev) => ({ name: ev.name, kind: 'event', jd: ev.jd, whenStr: ev.whenStr }));\n    const loc = saved.loc || {};\n    this.lat = loc.lat ?? 43.334; this.lng = loc.lng ?? -90.386; // Richland Center fallback\n    this.state = {\n      sheet: null, sheetData: null, flipped: false, helpOpen: false, panel: null,\n      saveOpen: false, saveName: '', saveKind: 'event',\n      natal: Object.assign({ date: '', time: '', place: '', lat: '', lon: '' }, saved.natal),\n      // (O4) showNatal retired — the plate now derives from natal-presence × seat, not a flag.\n      show: Object.assign({ nodes: true, lilith: false, chiron: false, ceres: false, pallas: false, juno: false, vesta: false, fortune: false, vertex: false, mc: false, ic: false, dsc: false }, saved.show),\n      planetOn: Object.assign(Object.fromEntries(this.BODIES.map((b) => [b, true])), saved.planetOn),\n      aspOn: Object.assign({}, this.ASP_DEFAULTS, saved.aspOn),\n      settings: Object.assign({}, this.DEFAULTS, saved.settings),\n      saved: charts,\n      evName: '', evWhen: '', locLabel: loc.label || null, locPlace: loc.place || '', locSet: !!saved.loc,\n      skin: this._migrateSkin(Object.assign({ houseNums: true, parallax: true }, saved.skin)),\n      composite: saved.composite ?? false,\n      rete: saved.rete ?? 'sky', seatPicker: null, seatsRevealed: false,\n      pplName: '', pplDate: '', pplTime: '', pplPlace: '',\n      dateOpen: false, dateVal: '', lens: 'aspects',\n      hintsDismissed: saved.hintsDismissed ?? false,\n    };\n  }\n\n  _elemOf(lon) { return this.ELEM[Math.floor(this.norm(lon) / 30) % 4]; }\n  _hexA(hex, a) {\n    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';\n  }\n  // a bead of poured metal — same recipe as the brass limb, shrunk to a point. hue-tagged for who.\n  _giltBead(ctx, x, y, r, alpha, violet) {\n    const hi = violet ? '245,240,255' : '255,240,205', mid = violet ? '185,174,224' : '217,176,106', lo = violet ? '86,74,130' : '110,77,29';\n    const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.42, r * 0.1, x, y, r);\n    g.addColorStop(0, 'rgba(' + hi + ',' + alpha + ')');\n    g.addColorStop(0.5, 'rgba(' + mid + ',' + alpha + ')');\n    g.addColorStop(1, 'rgba(' + lo + ',' + alpha + ')');\n    ctx.fillStyle = g;\n    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();\n    ctx.strokeStyle = 'rgba(' + hi + ',' + (alpha * 0.65) + ')'; ctx.lineWidth = 0.6;\n    ctx.beginPath(); ctx.arc(x, y, r * 0.98, 0, 7); ctx.stroke();\n  }\n  // S1 — the Moon's true phase, painted once and shared everywhere it appears (wheel,\n  // \\u264B panel, header mini-disc). ctx is caller-positioned; this paints a terminator-lit\n  // disc at (x,y) radius r. angle (radians) rotates the lit hemisphere to a real screen\n  // bearing toward the Sun \\u2014 the wheel passes its true bearing (it can be rotated in\n  // horizon lock); standalone icons omit it and fall back to a fixed wax-right/wane-left\n  // convention (same cos(elongation) math either way \\u2014 verified against both prior\n  // implementations: k=(1-cos(el))/2 <=> |1-2k| = cos(el), so the terminator width and\n  // light/dark split agree exactly).\n  _moonFace(ctx, x, y, r, sunLon, moonLon, opts) {\n    opts = opts || {};\n    const lit = opts.lit || '#f6f2e4', dark = opts.dark || '#221a4a';\n    const el = Math.abs(this.wrap(moonLon - sunLon)); // 0..180 \\u2014 true elongation magnitude\n    const waxing = this.norm(moonLon - sunLon) < 180;\n    const th = opts.angle != null ? opts.angle : (waxing ? 0 : Math.PI);\n    if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.glowBlur || 10; }\n    ctx.save();\n    ctx.translate(x, y); ctx.rotate(th);\n    ctx.fillStyle = dark;\n    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();\n    ctx.shadowBlur = 0;\n    ctx.fillStyle = lit;\n    ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2); ctx.fill();\n    const rx = Math.abs(Math.cos(el * Math.PI / 180)) * r;\n    ctx.fillStyle = el < 90 ? dark : lit;\n    ctx.beginPath(); ctx.ellipse(0, 0, rx, r, 0, 0, Math.PI * 2); ctx.fill();\n    ctx.restore();\n    ctx.shadowBlur = 0;\n    if (opts.rim !== false) {\n      ctx.strokeStyle = opts.rimColor || 'rgba(220,214,240,0.3)'; ctx.lineWidth = opts.rimWidth || 1;\n      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();\n    }\n  }\n  _canvasAng(lon) { return -(180 + lon + (this._rot || 0)) * Math.PI / 180; }\n\n  _active() {\n    const b = this.BODIES.filter((n) => this.state.planetOn[n] !== false);\n    const s = this.state.show;\n    if (s.nodes) b.push('Node', 'SNode');\n    if (s.lilith) b.push('Lilith');\n    if (s.chiron) b.push('Chiron');\n    if (s.ceres) b.push('Ceres');\n    if (s.pallas) b.push('Pallas');\n    if (s.juno) b.push('Juno');\n    if (s.vesta) b.push('Vesta');\n    if (s.fortune) b.push('Fortune');\n    if (s.vertex) b.push('Vertex');\n    if (s.mc) b.push('MC');\n    if (s.ic) b.push('IC');\n    if (s.dsc) b.push('DSC');\n    return b;\n  }\n  _aspects() { return this.ASPECTS.filter(([ang]) => this.state.aspOn[ang] !== false); }\n  _orbFor(ang) { return this.state.settings.orb * (this.ORB_SCALE[ang] ?? 1); }\n  _aspChip(ang, color, s) {\n    const on = s.aspOn[ang] !== false;\n    return {\n      glyph: this.ASYM[ang],\n      name: this.ASP_NAME[ang],\n      col: on ? color : 'rgba(143,134,192,0.3)',\n      txt: on ? '#a89ecf' : 'rgba(143,134,192,0.35)',\n      bd: on ? this._hexA(color === '#ece8f8' ? '#a89ecf' : color, 0.45) : 'rgba(190,184,226,0.12)',\n      tap: () => this._toggleAsp(ang),\n    };\n  }\n  _partners(held) {\n    return this._active().filter((n) => n !== 'SNode' && n !== held && !(held === 'SNode' && n === 'Node'));\n  }\n\n  _persist(patch) {\n    const s = Object.assign({}, this.state, patch || {});\n    try {\n      localStorage.setItem('orbo.astrolabe.back', JSON.stringify({\n        natal: s.natal, show: s.show, planetOn: s.planetOn, skin: s.skin, composite: s.composite, rete: s.rete,\n        aspOn: s.aspOn, settings: s.settings, saved: s.saved, hintsDismissed: s.hintsDismissed,\n        loc: s.locSet ? { lat: this.lat, lng: this.lng, label: s.locLabel, place: s.locPlace } : null,\n      }));\n    } catch (e) {}\n  }\n  _setNatal(k, v) {\n    const natal = Object.assign({}, this.state.natal); natal[k] = v;\n    this._natalKey = null;\n    const patch = { natal };\n    // S3 \\u2014 stale-seat guard, natal half: composite-me only exists while a natal is\n    // engraved (_natal's truth table); clearing the date \\u2014 natal's sole presence gate,\n    // see _natalJd \\u2014 out from under an engaged composite would leave the plate seated\n    // on a chart that no longer exists. Release it the same way the \\u2653 panel's own\n    // off-switch does (_toggleComposite).\n    if (k === 'date' && !v && this.state.composite) {\n      patch.composite = false;\n      patch.rete = this.state.rete === 'off' ? 'sky' : this.state.rete;\n      this._lastReadout.civil = null;\n    }\n    this.setState(patch); this._persist(patch);\n  }\n  _setSetting(k, v) {\n    const settings = Object.assign({}, this.state.settings); settings[k] = v;\n    this.setState({ settings }); this._persist({ settings });\n  }\n  _objChip(o) {\n    const on = !!this.state.show[o.key];\n    return {\n      glyph: o.glyph, name: o.name,\n      col: on ? '#ece8f8' : 'rgba(143,134,192,0.35)', txt: on ? '#a89ecf' : 'rgba(143,134,192,0.35)',\n      bd: on ? 'rgba(232,171,65,0.4)' : 'rgba(190,184,226,0.12)',\n      tap: () => this._toggleShow(o.key),\n    };\n  }\n  _setSkin(k) {\n    const skin = Object.assign({}, this.state.skin); skin[k] = !skin[k];\n    this.setState({ skin }); this._persist({ skin });\n  }\n  // O1 (♌ re-home): the limb is two orthogonal facts — decan faces (off/engraved)\n  // and rim metal (none/brass/silver). The packed skin.limb string and the legacy\n  // skin.decans boolean are retired; _migrateSkin folds any old value into\n  // {faces, metal} once, on load. (The sheet is always silver — no chip; see F1.)\n  _migrateSkin(skin) {\n    if (skin.metal == null || skin.faces == null) {\n      const legacy = skin.limb || (skin.decans ? 'engraved' : 'off');\n      skin.metal = legacy.indexOf('brass') === 0 || legacy.indexOf('silver') === 0 ? 'brass' : 'no rom the held hand to the plate — engraved tone, dashed, never confusable with sky-to-sky\n    if (skyOn && this.held && natT.length) {\n      const heldLonN = this.held === 'ASC' ? this.asc : this.pos[this.held];\n      const [hx, hy] = this._xy(heldLonN, rAsp);\n      ctx.setLineDash([2.5, 4]);\n      for (const t of natT) {\n        const diffN = Math.abs(this.wrap(heldLonN - t.lon));\n        for (const [ang] of aspects) {\n          const dN = Math.abs(diffN - ang);\n          const orbN = this._orbFor(ang);\n          if (dN > orbN) continue;\n          const tt = 1 - dN / orbN;\n          const [nx, ny] = this._xy(t.lon, rN);\n          ctx.strokeStyle = '#b9aee0';\n          ctx.globalAlpha = 0.18 + 0.55 * tt;\n          ctx.lineWidth = 0.6 + 1.1 * tt;\n          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(nx, ny); ctx.stroke();\n          ctx.globalAlpha = 0.12 + 0.4 * tt;\n          ctx.beginPath(); ctx.arc(nx, ny, 9.5, 0, 7); ctx.stroke();\n          break;\n        }\n      }\n      ctx.setLineDash([]);\n      ctx.globalAlpha = 1;\n    }\n\n    // –– frozen actor — a seated person/event on the rete: matte stone riding the sky's\n    // track, never light, never moving. threads cross to the plate, dashed. ––\n    if (rete && typeof rete === 'object' && rete.jd && this.eph) {\n      const rc = this._reteChart(rete);\n      if (rc) {\n        const ink = rete.kind === 'person' ? '185,174,224' : '207,201,234';\n        const plate = [];\n        if (this.state.composite && this.comp) { for (const k in this.comp) if (this.comp[k] != null) plate.push({ lon: this.comp[k], rr: k === 'cASC' ? R + 1 : rN }); }\n        else for (const t of natT) plate.push({ lon: t.lon, rr: rN });\n        ctx.setLineDash([2.5, 4]);\n        for (const b of this.BODIES) {\n          const bl = rc.pos[b]; if (bl == null) continue;\n          const [x1, y1] = this._xy(bl, rBody);\n          for (const p of plate) {\n            const diff = Math.abs(this.wrap(bl - p.lon));\n            for (const [ang] of aspects) {\n              const d = Math.abs(diff - ang); if (d > orb) continue;\n              const tt = 1 - d / orb;\n              const [x2, y2] = this._xy(p.lon, p.rr);\n              ctx.strokeStyle = 'rgba(' + ink + ',' + (0.14 + 0.4 * tt) + ')';\n              ctx.lineWidth = 0.6 + 0.9 * tt;\n              ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n              break;\n            }\n          }\n        }\n        ctx.setLineDash([]);\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        for (const b of this.BODIES) {\n          const bl = rc.pos[b]; if (bl == null) continue;\n          const [x, y] = this._xy(bl, rBody);\n          const [t1x, t1y] = this._xy(bl, rSignIn - 5), [t2x, t2y] = this._xy(bl, rSignIn);\n          ctx.strokeStyle = 'rgba(' + ink + ',0.4)'; ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.moveTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.stroke();\n          ctx.fillStyle = 'rgba(14,9,36,0.5)';\n          ctx.beginPath(); ctx.arc(x, y, 10.5, 0, 7); ctx.fill();\n          ctx.fillStyle = 'rgba(' + ink + ',0.9)';\n          ctx.font = '17px \"Noto Sans Symbols 2\",\"Segoe UI Symbol\",\"Apple Symbols\",serif';\n          ctx.fillText(this.GLYPH[b], x, y);\n        }\n        if (rc.asc != null) {\n          const [ax3, ay3] = this._xy(rc.asc, R + 1);\n          ctx.fillStyle = '#140e30';\n          ctx.beginPath(); ctx.arc(ax3, ay3, 10, 0, 7); ctx.fill();\n          ctx.strokeStyle = 'rgba(' + ink + ',0.8)'; ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.arc(ax3, ay3, 10, 0, 7); ctx.stroke();\n          ctx.fillStyle = 'rgba(' + ink + ',0.95)';\n          ctx.font = 'bold 10px \"Avenir Next\",\"Century Gothic\",sans-serif';\n          ctx.fillText('As', ax3, ay3);\n        }\n      }\n    }\n\n    const ascCol = this._elemOf(this.asc);\n    const [ax1, ay1] = this._xy(this.asc, rAsp), [ax2, ay2] = this._xy(this.asc, R - 10);\n    ctx.strokeStyle = this.held === 'ASC' ? this._hexA(ascCol, 0.95) : this._hexA(ascCol, 0.5);\n    ctx.lineWidth = this.held === 'ASC' ? 2 : 1.3;\n    ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.stroke();\n    const [alx, aly] = this._xy(this.asc, R + 1);\n    ctx.fillStyle = '#140e30';\n    ctx.beginPath(); ctx.arc(alx, aly, 11, 0, 7); ctx.fill();\n    ctx.strokeStyle = this._hexA(ascCol, this.held === 'ASC' ? 0.95 : 0.55); ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(alx, aly, 11, 0, 7); ctx.stroke();\n    ctx.fillStyle = ascCol;\n    ctx.font = 'bold 11px \"Avenir Next\",\"Century Gothic\",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    ctx.fillText('As', alx, aly);\n    this._screen = { ASC: [alx, aly] };\n\n    // O3 — the Descendant: the fourth angle, drawn only via its ♏ toggle, on the plate\n    // like MC/IC (see the isAngle branch below) — no separate always-on rim badge.\n\n    const order = act.map((n) => ({ n, lon: this.pos[n], lvl: 0 })).sort((p, q) => p.lon - q.lon);\n    let cluster = [];\n    const clusters = [];\n    for (const o of order) {\n      if (cluster.length && o.lon - cluster[cluster.length - 1].lon < 9) cluster.push(o);\n      else { cluster = [o]; clusters.push(cluster); }\n    }\n    for (const cl of clusters) {\n      [...cl].sort((p, q) => this.PERIODS[p.n] - this.PERIODS[q.n]).forEach((o, i) => { o.lvl = i % 2; });\n    }\n    const drawOrder = [...order].sort((p, q) => this.PERIODS[q.n] - this.PERIODS[p.n]);\n    for (const o of (skyOn ? drawOrder : [])) {\n      // conjunctions stack ALONG the rim (Vertex treatment): depth-of-field, never a drop\n      // onto the plate — the inner radius belongs to the natal/composite chart alone.\n      const r = rBody - o.lvl * 6;\n      const [x, y] = this._xy(o.lon, r);\n      const isHeld = this.held === o.n;\n      const [t1x, t1y] = this._xy(o.lon, rSignIn - 5), [t2x, t2y] = this._xy(o.lon, rSignIn);\n      ctx.strokeStyle = isHeld ? 'rgba(232,171,65,0.95)' : 'rgba(220,214,240,0.5)';\n      ctx.lineWidth = isHeld ? 2 : 1;\n      ctx.beginPath(); ctx.moveTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.stroke();\n      if (isHeld) {\n        ctx.strokeStyle = 'rgba(232,171,65,0.8)'; ctx.lineWidth = 1.4;\n        ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.stroke();\n        ctx.strokeStyle = 'rgba(232,171,65,0.25)';\n        const [dx1, dy1] = this._xy(o.lon, rAsp);\n        ctx.beginPath(); ctx.moveTo(dx1, dy1); ctx.lineTo(x, y); ctx.stroke();\n      }\n      const atRest = !this.held && !this.playing;\n      const elemColor = this._elemOf(o.lon);\n      const deep = o.lvl > 0 && !isHeld;\n      const base = 23 - 1.2 * Math.log10(this.PERIODS[o.n]);\n      // O3 — the angles (MC/IC/Vertex/DSC) leave the symbol-serif path: a quiet ~8.5px\n      // bold-sans badge in the As family, no backing disc, no ring, subordinate alpha.\n      const isAngle = o.n === 'MC' || o.n === 'IC' || o.n === 'Vertex' || o.n === 'DSC';\n      if (isAngle) {\n        const lab = { MC: 'MC', IC: 'IC', Vertex: 'Vx', DSC: 'DS' }[o.n] || o.n;\n        ctx.globalAlpha = deep ? 0.55 : 0.9;\n        ctx.fillStyle = isHeld ? '#e8ab41' : this._hexA(elemColor, 0.7);\n        ctx.shadowColor = isHeld ? '#e8ab41' : 'transparent';\n        ctx.shadowBlur = isHeld ? 8 : 0;\n        ctx.font = (isHeld ? 'bold 9.5' : 'bold 8.5') + 'px \"Avenir Next\",\"Century Gothic\",sans-serif';\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(lab, x, y);\n        ctx.shadowBlur = 0; ctx.globalAlpha = 1;\n        this._screen[o.n] = [x, y];\n        continue;\n      }\n      ctx.fillStyle = deep ? 'rgba(14,9,36,0.55)' : 'rgba(14,9,36,0.35)';\n      ctx.beginPath(); ctx.arc(x, y, deep ? 9 : 11, 0, 7); ctx.fill();\n      if (deep) ctx.globalAlpha = 0.6;\n      ctx.fillStyle = isHeld ? '#e8ab41' : atRest ? elemColor : (o.n === 'Sun' || o.n === 'Moon') ? '#f6f2e4' : '#dcd7f0';\n      ctx.shadowColor = isHeld ? '#e8ab41' : atRest ? elemColor : 'rgba(240,238,252,0.8)';\n      ctx.shadowBlur = isHeld ? 14 : deep ? 3 : 6;\n      ctx.font = (isHeld ? 'bold ' : '') + (isHeld ? base + 2 : deep ? base - 3 : base).toFixed(1) + 'px \"Noto Sans Symbols 2\",\"Segoe UI Symbol\",\"Apple Symbols\",serif';\n      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n      if (o.n === 'Moon') {\n        // the Moon IS a moon — true terminator, lit limb facing the Sun across the wheel.\n        // scrub a week and watch it wax; conjunction goes dark, opposition fills.\n        const mr = isHeld ? 9.5 : deep ? 6.5 : 8;\n        const [sux, suy] = this._xy(this.pos.Sun, rBody);\n        const th = Math.atan2(suy - y, sux - x);\n        this._moonFace(ctx, x, y, mr, this.pos.Sun, this.pos.Moon, {\n          angle: th, lit: isHeld ? '#f0d9a0' : '#f6f2e4', dark: '#221a4a',\n          glow: 'rgba(246,242,228,0.6)', glowBlur: isHeld ? 12 : 5,\n          rimColor: 'rgba(246,242,228,0.35)', rimWidth: 0.8,\n        });\n      } else {\n        ctx.fillText(this.GLYPH[o.n], x, y);\n      }\n      ctx.shadowBlur = 0;\n      ctx.globalAlpha = 1;\n      this._screen[o.n] = [x, y];\n    }\n\n    if (this._pulse && this.held && this._screen[this.held]) {\n      const age = (performance.now() - this._pulse.t0) / 300;\n      if (age < 1) {\n        const k2 = this._pulse.kind;\n        const [px, py] = this._screen[this.held];\n        const rr = 16 + age * (k2 === 'deg' ? 9 : k2 === 'sign' ? 18 : 30);\n        ctx.strokeStyle = k2 === 'aspect' ? '#f2f0fc' : '#e8ab41';\n        ctx.globalAlpha = (1 - age) * (k2 === 'deg' ? 0.3 : k2 === 'sign' ? 0.55 : 0.85);\n        ctx.lineWidth = k2 === 'aspect' ? 2 : 1.3;\n        ctx.beginPath(); ctx.arc(px, py, rr, 0, 7); ctx.stroke();\n        ctx.globalAlpha = 1;\n      } else this._pulse = null;\n    }\n\n    ctx.strokeStyle = 'rgba(190,184,226,0.12)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, 7); ctx.stroke();\n    if (this.state.settings.showPlayIcon) {\n      ctx.fillStyle = 'rgba(236,232,248,0.32)';\n      if (this.playing) {\n        ctx.fillRect(cx - 8, cy - 9, 5, 18); ctx.fillRect(cx + 3, cy - 9, 5, 18);\n      } else {\n        ctx.beginPath(); ctx.moveTo(cx - 6, cy - 10); ctx.lineTo(cx + 10, cy); ctx.lineTo(cx - 6, cy + 10); ctx.closePath(); ctx.fill();\n      }\n    }\n\n    // the eclipse — as the Moon-sheet rises, the instrument's light retreats. A shadow\n    // sweeps up from the lower limb, deepest nearest the Moon; the header (the depth-0\n    // readout) stays lit above. DOM veil handles the field; this handles the brass.\n    const ecl = this._eclipse || 0;\n    if (ecl > 0.01) {\n      const g = ctx.createLinearGradient(0, cy - R * 1.1, 0, cy + R * 1.15);\n      g.addColorStop(0, 'rgba(5,3,15,' + (0.30 * ecl).toFixed(3) + ')');\n      g.addColorStop(1, 'rgba(5,3,15,' + (0.68 * ecl).toFixed(3) + ')');\n      ctx.fillStyle = g;\n      ctx.fillRect(0, 0, w, cy + R * 1.4);\n    }\n  }\n\n  _fmtShort(lon) {\n    const s = Math.floor(this.norm(lon) / 30), d = Math.floor(this.norm(lon) % 30);\n    return d + '\\u00B0' + this.SIGNS[s] + '\\uFE0E';\n  }\n  _fmtLong(lon) {\n    const L = this.norm(lon), s = Math.floor(L / 30), d = Math.floor(L % 30), m = Math.floor((L % 1) * 60);\n    return d + '\\u00B0 ' + String(m).padStart(2, '0') + '\\u2032 ' + this.SIGN_NAMES[s];\n  }\n  _humanPeriod(d) {\n    if (d < 0.94) return (d * 24).toFixed(1) + ' hours';\n    if (d < 1.5) return '1 day';\n    if (d < 40) return d.toFixed(1) + ' days';\n    if (d < 400) return Math.round(d) + ' days';\n    return (d / 365.25).toFixed(1) + ' years';\n  }\n\n  _readouts() {\n    // S1: the header's own moon-face, kept as a plain sibling canvas (not part of the\n    // skyRef innerHTML rewrite below) so it never gets torn down/orphaned by the three\n    // header text branches \\u2014 phase is a sky fact anyway, true regardless of which\n    // chart owns the wheel, so it draws unconditionally from the real Sun/Moon longitudes.\n    if (this.pos && this.moonHeadRef.current) {\n      const mctx = this.moonHeadRef.current.getContext('2d');\n      mctx.clearRect(0, 0, 32, 32);\n      this._moonFace(mctx, 16, 16, 14, this.pos.Sun, this.pos.Moon, { dark: '#140e30', rimColor: 'rgba(220,214,240,0.35)' });\n    }\n    const set = (ref, key, val) => {\n      if (this._lastReadout[key] !== val && ref.current) { ref.current.textContent = val; this._lastReadout[key] = val; }\n    };\n    const setH = (ref, key, val) => {\n      if (this._lastReadout[key] !== val && ref.current) { ref.current.innerHTML = val; this._lastReadout[key] = val; }\n    };\n    const dte = this.eph.jdToDate(this.jd);\n    set(this.civilRef, 'civil',\n      dte.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +\n      ' \\u00B7 ' + dte.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' }));\n    const beadKey = this.held && this._heldBeadKey();\n    if (beadKey) {\n      // ♓ held bead — the readout speaks gilt: composite longitude + the half-gear sweep\n      const cLon = this.comp ? (beadKey === 'cASC' ? this.comp.cASC : this.comp[beadKey]) : null;\n      if (cLon != null) {\n        setH(this.skyRef, 'sky', '<span style=\"color:#e8ab41\">' + (beadKey === 'cASC' ? 'As' : this.GLYPH[beadKey]) + ' ' + this._fmtLong(cLon) + '<\u002Fspan>');\n        const nm = beadKey === 'cASC' ? 'ASCENDANT' : (this.LABEL[beadKey] || beadKey).toUpperCase();\n        const per = this.PERIODS[beadKey === 'cASC' ? 'ASC' : beadKey] * 2 * (this._gearMult || 1);\n        set(this.gearRef, 'gear', 'COMPOSITE ' + nm + ' \\u00B7 1 SWEEP = ' + this._humanPeriod(per));\n        return;\n      }\n    }\n    if (this.held) {\n      const isAsc = this.held === 'ASC';\n      const lon = isAsc ? this.asc : this.pos[this.held];\n      let rx = '';\n      if (!isAsc && !this.NO_RX.includes(this.held)) {\n        const ahead = this._posAt(this.jd + 0.2)[this.held];\n        if (this.wrap(ahead - lon) < 0) rx = ' \\u211E';\n      }\n      setH(this.skyRef, 'sky', (isAsc ? '<span style=\"color:' + this._elemOf(this.asc) + '\">As<\u002Fspan>' : this.GLYPH[this.held]) + ' ' + this._fmtLong(lon) + rx);\n      const asp = this._aspectStatus();\n      const label = isAsc ? 'HORIZON' : (this.LABEL[this.held] || this.held).toUpperCase();\n      set(this.gearRef, 'gear', asp ? label + ' ' + asp : label + ' HAND \\u00B7 1 SWEEP = ' + this._humanPeriod(this.PERIODS[this.held] * (this._gearMult || 1)));\n    } else {\n      // –– HEADER-COLOR RULE (the Derivation Law, documented as part of the O-block) ––\n      // The big-three readout is the depth-0 report of whichever chart OWNS THE WHEEL:\n      //   · sky owns it (default/live, or a frozen person/event whose sky we ease to)\n      //     → each of ☉/☽/As wears its element color — the sky-state language.\n      //   · a depth-3 entity owns it (solo composite: rete off + composite on)\n      //     → the readout golds, because the wheel is re-seated to the lived \"you × now\"\n      //       chart. This is the ONLY sanctioned override of the element-color language.\n      // A held hand or bead colors by what's held (handled in the branches above).\n      const sep = '<span style=\"color:#5a5090\">  \\u00B7  <\u002Fspan>';\n      const rr = this.state.rete;\n      if (rr === 'off' && this.state.composite && this.comp) {\n        // solo composite — the header speaks gilt: your lived Sun · Moon · As\n        setH(this.skyRef, 'sky',\n          '<span style=\"color:#e8ab41\">\\u2609 ' + this._fmtShort(this.comp.Sun) + '<\u002Fspan>' + sep +\n          '<span style=\"color:#e8ab41\">\\u263D ' + this._fmtShort(this.comp.Moon) + '<\u002Fspan>' + sep +\n          '<span style=\"color:#e8ab41\">As ' + this._fmtShort(this.comp.cASC) + '<\u002Fspan>');\n      } else {\n        setH(this.skyRef, 'sky',\n          '<span style=\"color:' + this._elemOf(this.pos.Sun) + '\">\\u2609 ' + this._fmtShort(this.pos.Sun) + '<\u002Fspan>' + sep +\n          '<span style=\"color:' + this._elemOf(this.pos.Moon) + '\">\\u263D ' + this._fmtShort(this.pos.Moon) + '<\u002Fspan>' + sep +\n          '<span style=\"color:' + this._elemOf(this.asc) + '\">As ' + this._fmtShort(this.asc) + '<\u002Fspan>');\n      }\n      const v = this.state.settings.playSpeed;\n      set(this.gearRef, 'gear', this.playing ? 'PLAYING \\u00B7 ' + v + (this.frame === 'horizon' ? ' MIN / SEC' : ' H / SEC') : this.live ? '\\u25CF LIVE' : this._reteFrozen() ? ((this.state.rete.name || '') + ' \\u00B7 FROZEN').toUpperCase() : '\\u00A0');\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

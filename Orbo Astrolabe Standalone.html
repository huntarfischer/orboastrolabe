  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f299f11e-f3f0-4919-96e7-5dda78ac7bd2\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; background: #0b081c; }\n  a { color: #4da4d9; text-decoration: none; }\n  a:hover { color: #7cc0e8; }\n  input { color-scheme: dark; }\n  input::placeholder { color: #5a5090; }\n  input[type=\"range\"] { accent-color: #e8ab41; }\n<\u002Fstyle>\n<script type=\"module\">\n  // Static, discoverable references \\u2014 so bundling/export can inline these engines.\n  // (A runtime `import(new URL(...))` inside componentDidMount is invisible to a\n  // static-asset bundler; once exported standalone there's no sibling file left to\n  // fetch, the import throws, and \\u2014 as happened before \\u2014 that can kill anything\n  // gated on it. These plain imports run at page load, well before mount.)\n  import * as EPH from './ephem.js';\n  import * as FRAMING from './framing.js';\n  import { CITIES } from './cities.js';\n  window.__ORBO_EPH = EPH;\n  window.__ORBO_FRAMING = FRAMING;\n  window.__ORBO_CITIES = CITIES;\n<\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#0b081c;display:flex;justify-content:center;font-family:'Avenir Next','Century Gothic',Futura,'Trebuchet MS',sans-serif;color:#dcd7f0;\">\n  <div style=\"width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,0.85);background-color:#0c081f;background-image:linear-gradient(180deg, #0c081f 0%, #131a3e 24%, #26496e 46%, #7e5f2e 68%, #94522b 82%, #7c3a2f 94%, #632a2a 100%);background-repeat:no-repeat;background-size:100% 100%;\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 31px 27px, rgba(246,244,255,0.95), transparent 60%),radial-gradient(1px 1px at 118px 63px, rgba(236,232,248,0.7), transparent 60%),radial-gradient(1.3px 1.3px at 74px 141px, rgba(196,208,248,0.8), transparent 60%),radial-gradient(0.9px 0.9px at 163px 108px, rgba(236,232,248,0.55), transparent 60%),radial-gradient(1.1px 1.1px at 22px 189px, rgba(255,240,220,0.6), transparent 60%),radial-gradient(0.8px 0.8px at 201px 161px, rgba(236,232,248,0.5), transparent 60%),radial-gradient(1.4px 1.4px at 147px 217px, rgba(214,224,255,0.75), transparent 60%),radial-gradient(0.9px 0.9px at 55px 88px, rgba(236,232,248,0.6), transparent 60%);background-size:231px 231px,199px 199px,253px 253px,181px 181px,269px 269px,211px 211px,241px 241px,223px 223px;mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);-webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);\"><\u002Fdiv>\n\n    <div style=\"padding:20px 22px 8px 22px;display:flex;flex-direction:column;gap:7px;position:relative;\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;\">\n        <div style=\"font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8f86c0;\">Orbo Astrolabe<\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#5a5090;\">prototype<\u002Fdiv>\n      <\u002Fdiv>\n      <div ref=\"{{ skyRef }}\" style=\"font-size:22px;line-height:1.25;color:#f2f0fc;min-height:28px;letter-spacing:0.02em;text-align:center;\">…<\u002Fdiv>\n      <div ref=\"{{ civilRef }}\" onpointerdown=\"{{ clockDown }}\" onpointerup=\"{{ clockUp }}\" onpointerleave=\"{{ clockCancel }}\" style=\"user-select:none;-webkit-user-select:none;font-size:12px;color:#a99ecf;min-height:14px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;cursor:pointer;\">&nbsp;<\u002Fdiv>\n      <div ref=\"{{ gearRef }}\" style=\"font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#e8ab41;min-height:14px;white-space:nowrap;text-align:center;\">&nbsp;<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;width:100%;perspective:1400px;\">\n      <div style=\"position:relative;width:100%;transform-style:preserve-3d;transition:transform 0.7s cubic-bezier(0.4,0.1,0.2,1);transform:{{ flipTf }};\">\n        <canvas ref=\"{{ canvasRef }}\" style=\"display:block;width:100%;touch-action:none;cursor:crosshair;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:{{ frontPe }};\"><\u002Fcanvas>\n\n        <div style=\"position:absolute;inset:15px;border-radius:50%;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:{{ backPe }};background:radial-gradient(closest-side, #1a1348 0%, #181143 62%, #100b30 100%);border:1.3px solid rgba(190,184,226,0.3);box-shadow:0 8px 22px rgba(0,0,0,0.6);overflow:hidden;\">\n          <svg viewBox=\"0 0 100 100\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n            <circle cx=\"50\" cy=\"50\" r=\"49.3\" fill=\"none\" stroke=\"rgba(190,184,226,0.2)\" stroke-width=\"0.35\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"rgba(190,184,226,0.16)\" stroke-width=\"0.3\"><\u002Fcircle>\n            <sc-for list=\"{{ segs }}\" as=\"sg\">\n              <path d=\"{{ sg.d }}\" fill=\"{{ sg.fill }}\" stroke=\"rgba(190,184,226,0.14)\" stroke-width=\"0.25\" onclick=\"{{ sg.tap }}\" style=\"cursor:pointer;\"><\u002Fpath>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ segDots }}\" as=\"sd2\">\n              <circle cx=\"{{ sd2.x }}\" cy=\"{{ sd2.y }}\" r=\"0.7\" fill=\"#e8ab41\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ segs }}\" as=\"sg\">\n            <div style=\"position:absolute;left:{{ sg.gl }};top:{{ sg.gt }};transform:translate(-50%,-50%);pointer-events:none;font-size:19px;line-height:1;color:{{ sg.col }};font-family:'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols',serif;\">{{ sg.glyph }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;height:58%;display:flex;flex-direction:column;\">\n            <datalist id=\"orbo-cities\">\n              <sc-for list=\"{{ cityOpts }}\" as=\"cn\" hint-placeholder-count=\"0\">\n                <option value=\"{{ cn }}\"><\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fdatalist>\n\n            <sc-if value=\"{{ pLegend }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"text-align:center;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:#8f86c0;margin-bottom:8px;\">The back — you<\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;\">\n                <sc-for list=\"{{ legend }}\" as=\"lg\">\n                  <div onclick=\"{{ lg.tap }}\" style=\"display:flex;align-items:center;gap:8px;padding:3.5px 2px;cursor:pointer;opacity:{{ lg.op }};\">\n                    <div style=\"font-size:12px;color:#a89ecf;width:16px;text-align:center;\">{{ lg.glyph }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#dcd7f0;\">{{ lg.name }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ pNatal }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;\">\n                <div style=\"font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#e8ab41;\">♈︎ Natal chart<\u002Fdiv>\n                <div onclick=\"{{ closePanel }}\" style=\"font-size:12px;color:#5a5090;cursor:pointer;padding:0 2px;\">×<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;\">\n                <input typ
